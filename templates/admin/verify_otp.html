<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify OTP</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="/static/css/style.css">

</head>

<body class="login-body">

<div class="container">

<div class="row justify-content-center align-items-center vh-100">

<div class="col-md-5">

<div class="card shadow-lg border-0 p-5">

    <h2 class="text-center mb-4">

        Verify OTP

    </h2>

    <form method="POST"
          action="/verify-otp">

        <!-- OTP -->

        <div class="mb-3">

            <label class="form-label">

                Enter OTP

            </label>

            <input type="text"
                   name="otp"
                   class="form-control"
                   required>

        </div>

        <!-- PASSWORD -->

        <div class="mb-4">

            <label class="form-label">

                Create Password

            </label>

            <input type="password"
                   name="password"
                   class="form-control"
                   required>

        </div>

        <!-- BUTTON -->

        <button type="submit"
                class="btn btn-success w-100">

            Verify OTP

        </button>

    </form>

</div>

</div>

</div>

</div>

</body>
</html>
