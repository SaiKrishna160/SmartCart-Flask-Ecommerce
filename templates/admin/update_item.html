<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Product</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="/static/css/style.css">

</head>

<body>

<div class="d-flex">

<!-- ================= SIDEBAR ================= -->

<div class="sidebar p-4 text-white">

    <h2 class="mb-4">

        SmartCart

    </h2>

    <a href="/admin-dashboard"
       class="sidebar-link">

        Dashboard

    </a>

    <a href="/admin/add-item"
       class="sidebar-link">

        Add Product

    </a>

    <a href="/admin/item-list"
       class="sidebar-link">

        Product List

    </a>

    <a href="/admin/profile"
       class="sidebar-link">

        Profile

    </a>

    <a href="/admin-logout"
       class="sidebar-link text-danger">

        Logout

    </a>

</div>

<!-- ================= MAIN CONTENT ================= -->

<div class="main-content p-5 w-100">

<div class="container">

<div class="card shadow-lg border-0 p-5">

    <h2 class="text-center mb-4">

        Update Product

    </h2>

    <form method="POST"
          enctype="multipart/form-data">

        <!-- NAME -->

        <div class="mb-3">

            <label class="form-label">

                Product Name

            </label>

            <input type="text"
                   name="name"
                   value="{{ product.name }}"
                   class="form-control"
                   required>

        </div>

        <!-- DESCRIPTION -->

        <div class="mb-3">

            <label class="form-label">

                Description

            </label>

            <textarea name="description"
                      rows="4"
                      class="form-control">{{ product.description }}</textarea>

        </div>

        <!-- CATEGORY -->

        <div class="mb-3">

            <label class="form-label">

                Category

            </label>

            <input type="text"
                   name="category"
                   value="{{ product.category }}"
                   class="form-control"
                   required>

        </div>

        <!-- PRICE -->

        <div class="mb-3">

            <label class="form-label">

                Price

            </label>

            <input type="number"
                   name="price"
                   value="{{ product.price }}"
                   class="form-control"
                   required>

        </div>

        <!-- CURRENT IMAGE -->

        <div class="mb-3">

            <label class="form-label">

                Current Image

            </label>

            <br>

            <img src="/static/uploads/product_images/{{ product.image }}"
                 width="150"
                 class="rounded shadow">

        </div>

        <!-- NEW IMAGE -->

        <div class="mb-4">

            <label class="form-label">

                Upload New Image

            </label>

            <input type="file"
                   name="image"
                   class="form-control">

        </div>

        <!-- BUTTON -->

        <button type="submit"
                class="btn btn-success w-100">

            Update Product

        </button>

    </form>

</div>

</div>

</div>

</div>

</body>
</html>
