<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="/static/css/style.css">

</head>

<body>

<div class="d-flex">

<!-- ================= SIDEBAR ================= -->

<div class="sidebar p-4 text-white">

    <h2 class="mb-4">

        SmartCart

    </h2>

    <a href="/admin-dashboard"
       class="sidebar-link">

        Dashboard

    </a>

    <a href="/admin/add-item"
       class="sidebar-link">

        Add Product

    </a>

    <a href="/admin/item-list"
       class="sidebar-link">

        Product List

    </a>

    <a href="/admin/profile"
       class="sidebar-link">

        Profile

    </a>

    <a href="/admin-logout"
       class="sidebar-link text-danger">

        Logout

    </a>

</div>

<!-- ================= MAIN CONTENT ================= -->

<div class="main-content p-5 w-100">

    <h1 class="mb-4">

        Welcome {{ admin_name }}

    </h1>

    <div class="row">

        <!-- CARD 1 -->

        <div class="col-md-4">

            <div class="card shadow border-0 p-4 dashboard-card">

                <h3>

                    Add Products

                </h3>

                <p>

                    Add new products to your store.

                </p>

                <a href="/admin/add-item"
                   class="btn btn-primary">

                    Add Product

                </a>

            </div>

        </div>

        <!-- CARD 2 -->

        <div class="col-md-4">

            <div class="card shadow border-0 p-4 dashboard-card">

                <h3>

                    Product List

                </h3>

                <p>

                    Manage all uploaded products.

                </p>

                <a href="/admin/item-list"
                   class="btn btn-success">

                    View Products

                </a>

            </div>

        </div>

        <!-- CARD 3 -->

        <div class="col-md-4">

            <div class="card shadow border-0 p-4 dashboard-card">

                <h3>

                    Admin Profile

                </h3>

                <p>

                    Update profile information.

                </p>

                <a href="/admin/profile"
                   class="btn btn-dark">

                    Open Profile

                </a>

            </div>

        </div>

    </div>

</div>

</div>

</body>
</html>
