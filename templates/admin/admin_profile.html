<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="/static/css/style.css">

</head>

<body>

<div class="d-flex">

<!-- ================= SIDEBAR ================= -->

<div class="sidebar p-4 text-white">

    <h2 class="mb-4">

        SmartCart

    </h2>

    <a href="/admin-dashboard"
       class="sidebar-link">

        Dashboard

    </a>

    <a href="/admin/add-item"
       class="sidebar-link">

        Add Product

    </a>

    <a href="/admin/item-list"
       class="sidebar-link">

        Product List

    </a>

    <a href="/admin/profile"
       class="sidebar-link">

        Profile

    </a>

    <a href="/admin-logout"
       class="sidebar-link text-danger">

        Logout

    </a>

</div>

<!-- ================= MAIN CONTENT ================= -->

<div class="main-content p-5 w-100">

<div class="container">

<div class="card shadow-lg border-0 p-5">

    <h2 class="text-center mb-4">

        Admin Profile

    </h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}

        <div class="alert alert-success">

            {{ message }}

        </div>

      {% endfor %}
    {% endwith %}

    <!-- PROFILE IMAGE -->

    <div class="text-center mb-4">

        {% if admin.profile_image %}

        <img src="/static/uploads/admin_profiles/{{ admin.profile_image }}"
             class="profile-img shadow">

        {% else %}

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
             class="profile-img shadow">

        {% endif %}

    </div>

    <!-- FORM -->

    <form method="POST"
          action="/admin/profile"
          enctype="multipart/form-data">

        <!-- NAME -->

        <div class="mb-3">

            <label class="form-label">

                Name

            </label>

            <input type="text"
                   name="name"
                   value="{{ admin.name }}"
                   class="form-control"
                   required>

        </div>

        <!-- EMAIL -->

        <div class="mb-3">

            <label class="form-label">

                Email

            </label>

            <input type="email"
                   name="email"
                   value="{{ admin.email }}"
                   class="form-control"
                   required>

        </div>

        <!-- PASSWORD -->

        <div class="mb-3">

            <label class="form-label">

                New Password

            </label>

            <input type="password"
                   name="password"
                   class="form-control">

        </div>

        <!-- IMAGE -->

        <div class="mb-4">

            <label class="form-label">

                Upload Profile Image

            </label>

            <input type="file"
                   name="profile_image"
                   class="form-control">

        </div>

        <!-- BUTTON -->

        <button type="submit"
                class="btn btn-primary w-100">

            Update Profile

        </button>

    </form>

</div>

</div>

</div>

</div>

</body>
</html>
