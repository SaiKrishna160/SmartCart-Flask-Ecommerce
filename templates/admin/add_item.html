<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="/static/css/style.css">

</head>

<body>

<div class="d-flex">

<!-- ================= SIDEBAR ================= -->

<div class="sidebar p-4 text-white">

    <h2 class="mb-4">

        SmartCart

    </h2>

    <a href="/admin-dashboard"
       class="sidebar-link">

        Dashboard

    </a>

    <a href="/admin/add-item"
       class="sidebar-link">

        Add Product

    </a>

    <a href="/admin/item-list"
       class="sidebar-link">

        Product List

    </a>

    <a href="/admin/profile"
       class="sidebar-link">

        Profile

    </a>

    <a href="/admin-logout"
       class="sidebar-link text-danger">

        Logout

    </a>

</div>

<!-- ================= MAIN CONTENT ================= -->

<div class="main-content p-5 w-100">

<div class="container">

<div class="card shadow-lg border-0 p-5">

    <h2 class="mb-4 text-center">

        Add New Product

    </h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}

        <div class="alert alert-success">

            {{ message }}

        </div>

      {% endfor %}
    {% endwith %}

    <form method="POST"
          action="/admin/add-item"
          enctype="multipart/form-data">

        <!-- PRODUCT NAME -->

        <div class="mb-3">

            <label class="form-label">

                Product Name

            </label>

            <input type="text"
                   name="name"
                   class="form-control"
                   required>

        </div>

        <!-- DESCRIPTION -->

        <div class="mb-3">

            <label class="form-label">

                Description

            </label>

            <textarea name="description"
                      class="form-control"
                      rows="4"></textarea>

        </div>

        <!-- CATEGORY -->

        <div class="mb-3">

            <label class="form-label">

                Category

            </label>

            <input type="text"
                   name="category"
                   class="form-control"
                   required>

        </div>

        <!-- PRICE -->

        <div class="mb-3">

            <label class="form-label">

                Price

            </label>

            <input type="number"
                   name="price"
                   class="form-control"
                   required>

        </div>

        <!-- IMAGE -->

        <div class="mb-4">

            <label class="form-label">

                Product Image

            </label>

            <input type="file"
                   name="image"
                   class="form-control"
                   required>

        </div>

        <!-- BUTTON -->

        <button type="submit"
                class="btn btn-primary w-100">

            Add Product

        </button>

    </form>

</div>

</div>

</div>

</div>

</body>
</html>
